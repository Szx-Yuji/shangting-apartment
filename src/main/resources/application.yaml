spring:
  application:
    name: shangting-apartment-complete
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/shangting_apartment_complete?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:apartment_complete}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: ApartmentCompletePool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
  session:
    timeout: 30m
    data:
      redis:
        namespace: shangting:complete:session
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
server:
  port: ${SERVER_PORT:8082}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        name: SHANGTING_COMPLETE_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      tracking-modes: cookie
  error:
    include-message: never
    include-stacktrace: never
app:
  appointment-rate-limit:
    max-requests: 10
    window-seconds: 60
  admin-login-rate-limit:
    max-requests: 10
    window-seconds: 900
  demo:
    enabled: ${DEMO_ENABLED:false}
  demo-payments-enabled: ${DEMO_PAYMENTS_ENABLED:true}
  jobs:
    enabled: ${JOBS_ENABLED:true}
  uploads:
    directory: ${UPLOAD_DIRECTORY:./runtime/uploads}
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
